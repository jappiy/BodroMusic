[versions]
# Версии JVM-библиотек проверены по Maven Central (2026-10).
# Версии AndroidX / AGP взяты как заведомо существующие стабильные: maven.google.com
# был недоступен из среды сборки — обновить через `./gradlew dependencyUpdates` / IDE.
agp = "8.11.1"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.4"
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "5.3.2"
hilt = "2.57.2"
androidxHilt = "1.2.0"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.2"
navigation = "2.9.3"
composeBom = "2025.08.00"
media3 = "1.8.0"
room = "2.7.2"
datastore = "1.1.7"
work = "2.10.3"
palette = "1.0.0"
coil = "3.3.0"
tink = "1.18.0"
splashscreen = "1.0.1"
junit = "4.13.2"
mockk = "1.14.5"
turbine = "1.2.1"
robolectric = "4.16"
androidxTestCore = "1.6.1"
