name: Analyzer

on:
  push:
    branches: ["**"]
    paths: ["analyzer/**", ".github/workflows/analyzer.yml"]
  workflow_dispatch:

concurrency:
  group: analyzer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Тесты цикла воркера, дочернего процесса и декодирования не требуют Essentia; ffmpeg — как в образе.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install httpx==0.28.1 "numpy<2" pytest==8.3.4 ruff==0.8.4
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bodromusic-analyzer
          tags: |
            type=raw,value=latest
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: analyzer
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=analyzer
          cache-to: type=gha,mode=max,scope=analyzer
