name: Release

# Публикация: git tag v0.7.0 && git push origin v0.7.0 → страница релиза с APK.
# Или вручную: Actions → Release → Run workflow → версия (тег создаст GitHub).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без «v», например 0.7.0"
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Все сборки подписываются одним постоянным ключом (тот же, что на компьютере владельца), иначе Android
      # не ставит обновление поверх: «Приложение не установлено». Без секрета релиз не публикуется.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Нет секрета SIGNING_KEYSTORE_B64 — APK получится с чужой подписью и не встанет поверх"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bodro.keystore"
          echo "BODRO_KEYSTORE=$RUNNER_TEMP/bodro.keystore" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/bodro.keystore" -storepass android | grep -m1 SHA256
      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace
      - name: Name APKs by version
        id: apk
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BodroMusic-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/BodroMusic-${VERSION}-debug.apk"
          # Раздел CHANGELOG.md для этой версии — текст релиза.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > dist/notes.md
          cat >> dist/notes.md <<'NOTES'

          **Установка:** скачайте `BodroMusic-*.apk` на телефон и откройте (разрешите установку из неизвестных источников).
          `-debug.apk` ставится рядом с основной версией (`ru.bodro.music.debug`) — для проверки.
          NOTES
          ls -la dist
      - name: Check APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          bad=0
          for apk in dist/*.apk; do
            digest=$("$APKSIGNER" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            echo "$apk $digest"
            if [ "$digest" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$apk подписан другим ключом ($digest) — обновление поверх не встанет"
              bad=1
            fi
          done
          exit $bad
        env:
          EXPECTED_CERT_SHA256: c5146426d418eb6d93624b0a3b25cb08a5c48f3fdf94bdaa7d0bdf588b94de62
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: BodroMusic ${{ env.TAG }}
          body_path: dist/notes.md
          files: |
            dist/*.apk
          prerelease: ${{ startsWith(env.TAG, 'v0.') }}
