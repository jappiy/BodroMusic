name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug and release
        run: ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Unit tests
        run: ./gradlew test testDebugUnitTest --continue
      - name: Static analysis
        run: ./gradlew lintDebug ktlintCheck detekt --continue
      - name: Report static analysis problems as annotations
        # Логи раннера не всегда доступны снаружи, а аннотации видны через API check-runs.
        if: failure()
        run: |
          for f in $(find . -path '*/build/reports/*' \( -name '*.txt' \) \( -path '*ktlint*' -o -path '*detekt*' -o -name 'lint-results*' \) -size +0); do
            body=$(head -c 3500 "$f" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=$f::$body"
          done
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space
        # Эмулятору нужно место под userdata; на раннере много ненужного предустановленного.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs before starting the emulator
        # Сборка и эмулятор одновременно не помещаются в ресурсы раннера.
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # ATD — облегчённый образ Google для автотестов в CI.
          api-level: 33
          target: aosp_atd
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          pre-emulator-launch-script: free -m && df -h /
          script: |
            free -m
            ./gradlew connectedDebugAndroidTest --continue --no-daemon -Dorg.gradle.jvmargs=-Xmx2g -Dkotlin.compiler.execution.strategy=in-process
      - name: Failed tests as annotations
        # Текст упавших тестов — в аннотации проверки: их видно через публичный API без входа на GitHub.
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      text = (bad.text or bad.get("message") or "").strip().replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text[:3000]}")
          PY
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
