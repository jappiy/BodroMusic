# Пример: bodrod рядом с уже работающими Navidrome, slskd и Lidarr.
# Скопируйте в docker-compose.yml, подставьте адреса и ключи. Секреты лучше держать в .env.
services:
  bodrod:
    image: ghcr.io/jappiy/bodromusic-server:latest
    container_name: bodrod
    restart: unless-stopped
    # Владелец папки с музыкой: под ним создаются файлы в библиотеке (узнать: `id <пользователь>`).
    user: "1000:1000"
    ports:
      - "8790:8790"
    volumes:
      - ./bodrod-data:/data
      # Секреты файлами (chmod 600): navidrome_password — пароль админа Navidrome, в YAML и переменных его нет.
      - ./secrets:/secrets:ro
      # Общая папка музыки на запись: и загрузки slskd, и библиотека Navidrome.
      - /srv/music:/music
    environment:
      # Navidrome: админ-учётка нужна, чтобы запускать сканирование и проверять, есть ли трек в библиотеке.
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_ADMIN_USER: admin
      # Пароль читается из /secrets/navidrome_password (NAVIDROME_ADMIN_PASSWORD_FILE — если файл в другом месте).
      # slskd — скачивание отдельных треков. Ключ: slskd.yml → web.authentication.api_keys.
      SLSKD_URL: http://slskd:5030
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      # bodrod сам кладёт скачанное в библиотеку и прописывает теги. Без этих двух строк —
      # прежнее поведение: папка загрузок slskd должна быть внутри библиотеки.
      SLSKD_DOWNLOADS_DIR: /music/slsk
      LIBRARY_DIR: /music/library
      # LIBRARY_LAYOUT: "{artist}/{album}/{artist} - {title}"
      # DELETE_SOURCE: "true"
      # Lidarr — скачивание всей дискографии исполнителя. Ключ: Settings → General → API Key.
      LIDARR_URL: http://lidarr:8686
      LIDARR_API_KEY: ${LIDARR_API_KEY}
      # Необязательно: по умолчанию берутся первая корневая папка и первые профили Lidarr.
      # LIDARR_ROOT_FOLDER: /music
      # LIDARR_QUALITY_PROFILE_ID: "1"
      # LIDARR_METADATA_PROFILE_ID: "1"
      # Яндекс Музыка — первый источник цепочки (скачивание нужна подписка Плюс). Токен — файлом
      # /secrets/yandex_music_token (читается сам). Без токена Яндекс только ищет и даёт метаданные.
      # Цепочка источников по умолчанию; в приложении меняется перетаскиванием (Настройки → Источники загрузки).
      # SOURCES_ORDER: yandex,slskd,youtube,lidarr
      # YouTube Music через VPN: прокси для yt-dlp и ytmusicapi (или файлом /secrets/youtube_proxy).
      # YOUTUBE_PROXY: socks5://vpn:1080
      # Обслуживание библиотеки: источники обложек и тегов по порядку (по умолчанию так).
      # COVER_PROVIDERS: yandex,deezer,itunes,musicbrainz,lastfm
      # TAG_PROVIDERS: musicbrainz,yandex,deezer,lastfm
      # Last.fm — дополнительный канал для тегов, обложек и поиска; ключ — файлом /secrets/lastfm_api_key.
      # LASTFM_API_KEY_FILE: /secrets/lastfm_api_key
      # DISCOVER_PROVIDERS: yandex,deezer,lastfm
      # Архив Яндекса для рекомендаций: токены аккаунтов файлами /secrets/yandex_accounts/<логин Яндекса>
      # (или явно: YANDEX_ACCOUNTS: jappi:/secrets/ya_jappi,kalainidi:/secrets/ya_kalainidi). Архив — на большой диск:
      # YANDEX_ARCHIVE_DIR: /archive
      # Чей аккаунт Яндекса у какого пользователя приложения: логин_navidrome:логин_яндекса через запятую.
      # Можно и в приложении (Рекомендации → Архив Яндекса → Привязать) — значение из приложения важнее.
      # Без привязки источник «Архив Яндекса» пишет «Не привязан аккаунт Яндекса», предзакачка в резерв ждёт.
      YANDEX_USERS: ${YANDEX_USERS:-}
      # ListenBrainz — источник рекомендаций. Токен: listenbrainz.org → Settings → User token (или файлом
      # /secrets/listenbrainz_token). Пользователи: логин_navidrome:логин_lb через запятую — для плейлистов
      # Weekly Exploration / Weekly Jams. Без токена и пользователя источник выключен с ошибкой конфигурации.
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}
      LISTENBRAINZ_USERS: ${LISTENBRAINZ_USERS:-}
