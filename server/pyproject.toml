[project]
name = "bodrod"
version = "0.25.0"
description = "Сервис загрузок BodroMusic: Яндекс Музыка + slskd + YouTube Music + Lidarr + Navidrome"
requires-python = ">=3.12"

[project.optional-dependencies]
# BLURB_LLM_PROVIDER=anthropic: подводки к трекам через Claude. В requirements.txt не входит — нужна новая база образа.
llm = ["anthropic"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
