[project]
name = "bodrod"
version = "0.2.0"
description = "Сервис загрузок BodroMusic: slskd + Lidarr + Navidrome"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
