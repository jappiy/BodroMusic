# Поверх стандартной конфигурации detekt.
complexity:
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 14
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 120
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 40
    thresholdInClasses: 40
    thresholdInInterfaces: 40
    thresholdInObjects: 30
  CyclomaticComplexMethod:
    threshold: 20
    ignoreSimpleWhenEntries: true
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    threshold: 5
style:
  ThrowsCount:
    max: 4
  MagicNumber:
    active: false
  ReturnCount:
    max: 4
  WildcardImport:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
naming:
  # Имена файлов проверяет ktlint (standard:filename); экраны держат ViewModel и Composable вместе.
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
